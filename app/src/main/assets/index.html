<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#128C7E">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>LAN Messenger</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;font-family:Tahoma,Arial,sans-serif;background:#f2f5f5;color:#17202a}
body{display:flex;align-items:center;justify-content:center;padding:18px}
.card{width:min(430px,100%);background:#fff;border-radius:24px;padding:26px 22px;box-shadow:0 10px 35px #00000018}
.logo{width:72px;height:72px;margin:0 auto 16px;border-radius:22px;background:#128C7E;color:#fff;display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:bold}
h1{text-align:center;font-size:22px;margin:0 0 8px}
.sub{text-align:center;color:#68747d;font-size:14px;line-height:1.8;margin-bottom:22px}
label{display:block;font-size:14px;font-weight:bold;margin:0 0 7px}
.row{display:flex;gap:10px;direction:ltr}
input{height:50px;border:1px solid #d8dfe2;border-radius:14px;padding:0 14px;font-size:16px;outline:none;background:#fafcfc}
input:focus{border-color:#128C7E;box-shadow:0 0 0 3px #128c7e18}
#host{flex:1}
#port{width:105px}
button{width:100%;height:52px;border:0;border-radius:15px;background:#128C7E;color:#fff;font-size:16px;font-weight:bold;margin-top:17px}
button:disabled{opacity:.65}
.status{min-height:52px;margin-top:15px;border-radius:14px;padding:11px 13px;font-size:13px;line-height:1.7;text-align:center;background:#f2f5f5;color:#59656d}
.status.ok{background:#e9f8f2;color:#08734f}
.status.err{background:#fff0f0;color:#a52222}
.status.wait{background:#eef6ff;color:#245c91}
.small{text-align:center;color:#8a949a;font-size:11px;margin-top:16px}
.link{display:none;text-align:center;margin-top:10px}
.link button{margin-top:0;background:#eef3f3;color:#128C7E}
</style>
</head>
<body>
<div class="card">
  <div class="logo">💬</div>
  <h1>LAN Messenger</h1>
  <div class="sub">در حال اتصال به سرور پیام‌رسان محلی شما</div>

  <label for="host">آدرس سرور</label>
  <div class="row">
    <input id="host" inputmode="decimal" autocomplete="off" placeholder="192.168.1.9">
    <input id="port" inputmode="numeric" autocomplete="off" placeholder="8080">
  </div>

  <button id="connect">اتصال به سرور</button>

  <div id="status" class="status wait">آماده بررسی سرور...</div>

  <div class="link" id="manual">
    <button id="openAnyway">باز کردن آدرس بدون بررسی</button>
  </div>

  <div class="small">آدرس موفق برای اجرای بعدی ذخیره می‌شود.</div>
</div>

<script>
(() => {
  const DEFAULT_HOST = "192.168.1.9";
  const DEFAULT_PORT = "8080";
  const KEY = "lan_messenger_server";

  const hostEl = document.getElementById("host");
  const portEl = document.getElementById("port");
  const connectBtn = document.getElementById("connect");
  const statusEl = document.getElementById("status");
  const manualEl = document.getElementById("manual");
  const openAnywayBtn = document.getElementById("openAnyway");

  let saved = null;
  try { saved = JSON.parse(localStorage.getItem(KEY) || "null"); } catch(e) {}

  hostEl.value = (saved && saved.host) || DEFAULT_HOST;
  portEl.value = (saved && saved.port) || DEFAULT_PORT;

  function cleanHost(v) {
    return v.trim()
      .replace(/^https?:\/\//i, "")
      .replace(/\/.*$/, "")
      .trim();
  }

  function makeUrl() {
    const host = cleanHost(hostEl.value);
    const port = portEl.value.trim().replace(/[^\d]/g, "");
    if (!host) throw new Error("آدرس سرور را وارد کنید.");
    if (!port || Number(port) < 1 || Number(port) > 65535)
      throw new Error("شماره پورت معتبر نیست.");
    return { host, port, url: "http://" + host + ":" + port + "/" };
  }

  function setStatus(text, type="wait") {
    statusEl.textContent = text;
    statusEl.className = "status " + type;
  }

  // Pure JavaScript HTTP reachability test.
  // We intentionally do not connect to MySQL; the server-side application handles DB.
  async function checkServer(baseUrl) {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), 5000);

    try {
      // Request the actual application. no-cors lets a WebView/browser perform
      // the network request even when the page itself is local. The response
      // cannot be inspected, but a successful HTTP fetch means the network
      // request completed.
      await fetch(baseUrl + "?__lan_launcher_check=" + Date.now(), {
        method: "GET",
        mode: "no-cors",
        cache: "no-store",
        redirect: "follow",
        signal: controller.signal
      });
      return true;
    } finally {
      clearTimeout(timer);
    }
  }

  async function connect() {
    let info;
    try {
      info = makeUrl();
    } catch(e) {
      setStatus(e.message, "err");
      return;
    }

    connectBtn.disabled = true;
    manualEl.style.display = "none";
    setStatus("در حال بررسی " + info.host + ":" + info.port + " ...", "wait");

    try {
      await checkServer(info.url);

      localStorage.setItem(KEY, JSON.stringify({
        host: info.host,
        port: info.port
      }));

      setStatus("سرور پیدا شد؛ در حال ورود به برنامه...", "ok");

      // Give the WebView a moment to show the successful state, then navigate
      // directly to the real server application.
      setTimeout(() => {
        window.location.href = info.url;
      }, 250);

    } catch(e) {
      setStatus(
        "اتصال به این آدرس برقرار نشد. IP و پورت را بررسی کنید و مطمئن شوید گوشی و سرور روی یک شبکه هستند.",
        "err"
      );
      manualEl.style.display = "block";
      connectBtn.disabled = false;
    }
  }

  connectBtn.addEventListener("click", connect);

  openAnywayBtn.addEventListener("click", () => {
    try {
      const info = makeUrl();
      localStorage.setItem(KEY, JSON.stringify({host:info.host,port:info.port}));
      window.location.href = info.url;
    } catch(e) {
      setStatus(e.message, "err");
    }
  });

  // Auto-check the saved/default address when the launcher starts.
  window.addEventListener("load", () => {
    setTimeout(connect, 250);
  });
})();
</script>
</body>
</html>
